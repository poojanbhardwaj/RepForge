version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/users/queries.sql
    gen:
      go:
        package: db
        out: internal/users/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
