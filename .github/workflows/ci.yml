name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REPFORGE_BUILD_VERSION: 0.2.0-milestone1
  REPFORGE_BUILD_COMMIT: ${{ github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: backend/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record UTC build time
        run: echo "REPFORGE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Start synthetic local platform
        run: pnpm run setup

      - name: Verify Milestone 1
        run: pnpm run verify

      - name: Go race tests
        working-directory: backend
        run: go test -race ./...

      - name: Security checks
        run: pnpm run security

      - name: Smoke test
        run: pnpm run smoke
